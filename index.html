<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAST 매입매출현황</title>
  
  <!-- 라이브러리 불러오기 (SheetJS & Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { background: #1b2a4a; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    header h1 { margin: 0 0 5px 0; font-size: 24px; }
    header p { margin: 0; font-size: 14px; opacity: 0.8; }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .upload-area { border: 2px dashed #3182ce; padding: 25px; text-align: center; border-radius: 8px; background: #ebf8ff; cursor: pointer; }

    .chart-container { position: relative; height: 320px; width: 100%; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; }
    th { background-color: #f7fafc; color: #4a5568; font-weight: 600; }

    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-normal { background-color: #c6f6d5; color: #22543d; }
    .badge-danger { background-color: #fed7d7; color: #742a2a; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>EAST 매입매출현황</h1>
    <p>EAST 매입매출시스템</p>
  </header>

  <!-- 1. 엑셀 파일 파일 업로드 카드 -->
  <div class="card">
    <div class="upload-area" onclick="document.getElementById('excelInput').click()">
      <b>📁 엑셀 파일(.xlsx)을 업로드하세요</b> (클릭하여 파일 선택)
      <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none;" />
    </div>
  </div>

  <!-- 2. 차트 영역 -->
  <div class="card">
    <h3>사업별 집행률 (%)</h3>
    <div class="chart-container">
      <canvas id="rateChart"></canvas>
    </div>
  </div>

  <!-- 3. 데이터 테이블 영역 -->
  <div class="card">
    <h3>사업 상세 내역</h3>
    <table>
      <thead>
        <tr>
          <th>사업명</th>
          <th>예산 (천원)</th>
          <th>집행액 (천원)</th>
          <th>집행률 (%)</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center; color:#a0aec0;">엑셀 파일을 업로드해 주세요.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let rateChart = null;

  // 파일 업로드 이벤트 등록
  document.getElementById('excelInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.readAsArrayBuffer(file);

    reader.onload = function(event) {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // 첫번째 시트 읽기
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      // JSON 데이터 변환
      const jsonData = XLSX.utils.sheet_to_json(worksheet);
      
      // 대시보드 업데이트
      updateDashboard(jsonData);
    };
  });

  function updateDashboard(data) {
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    const labels = [];
    const rates = [];

    data.forEach(row => {
      const name = row['사업명'] || '미지정';
      const budget = Number(row['예산']) || 0;
      const executed = Number(row['집행액']) || 0;
      const rate = budget > 0 ? ((executed / budget) * 100).toFixed(1) : 0;
      const isDanger = rate < 80;

      labels.push(name);
      rates.push(rate);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${name}</b></td>
        <td>${budget.toLocaleString()}</td>
        <td>${executed.toLocaleString()}</td>
        <td>${rate}%</td>
        <td>
          <span class="badge ${isDanger ? 'badge-danger' : 'badge-normal'}">
            ${isDanger ? '위험' : '정상'}
          </span>
        </td>
      `;
      tableBody.appendChild(tr);
    });

    renderChart(labels, rates);
  }

  function renderChart(labels, rates) {
    const ctx = document.getElementById('rateChart').getContext('2d');

    if (rateChart) rateChart.destroy();

    rateChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '직접비 집행률 (%)',
          data: rates,
          backgroundColor: rates.map(r => r < 80 ? '#e53e3e' : '#38a169'),
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, max: 100 }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });
  }
</script>

</body>
</html>
